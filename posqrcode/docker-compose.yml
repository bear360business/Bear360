services:
  postgres:
    image: postgres:16-alpine
    container_name: bear360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bear360
      POSTGRES_PASSWORD: bear360
      POSTGRES_DB: bear360
    ports:
      - '5433:5432'
    volumes:
      - bear360_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bear360 -d bear360']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bear360-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - bear360_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bear360_pg:
  bear360_redis:
