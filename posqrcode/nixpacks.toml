[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@10.33.0 --activate", "pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = [
  "pnpm --filter @bear360/shared build",
  "pnpm --filter @bear360/api prisma:generate",
  "pnpm --filter @bear360/api build"
]

[start]
cmd = "pnpm --filter @bear360/api prisma:migrate:deploy && node apps/api/dist/main.js"
