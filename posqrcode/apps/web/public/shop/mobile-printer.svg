<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480">
      <stop stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="body" x1="200" y1="120" x2="440" y2="340">
      <stop stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="320" cy="390" rx="130" ry="16" fill="#0F172A" opacity="0.1"/>
  <!-- paper -->
  <g filter="url(#shadow)">
    <rect x="255" y="95" width="130" height="90" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <line x1="275" y1="115" x2="365" y2="115" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="275" y1="130" x2="350" y2="130" stroke="#E2E8F0" stroke-width="3"/>
    <line x1="275" y1="145" x2="360" y2="145" stroke="#E2E8F0" stroke-width="3"/>
    <line x1="275" y1="160" x2="340" y2="160" stroke="#E2E8F0" stroke-width="3"/>
  </g>
  <!-- printer body -->
  <g filter="url(#shadow)">
    <rect x="210" y="175" width="220" height="160" rx="20" fill="url(#body)"/>
    <rect x="230" y="195" width="180" height="40" rx="8" fill="#1E293B"/>
    <circle cx="260" cy="290" r="10" fill="#22C55E"/>
    <rect x="285" y="282" width="50" height="16" rx="8" fill="#475569"/>
    <rect x="350" y="282" width="50" height="16" rx="8" fill="#475569"/>
  </g>
  <text x="320" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#64748B">Mobile thermal receipt printer</text>
</svg>
