<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="260" y1="60" x2="400" y2="380">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="320" cy="400" rx="120" ry="14" fill="#1E1B4B" opacity="0.1"/>
  <g filter="url(#shadow)">
    <!-- base -->
    <ellipse cx="320" cy="375" rx="90" ry="16" fill="#94A3B8"/>
    <ellipse cx="320" cy="370" rx="80" ry="12" fill="#CBD5E1"/>
    <!-- tall acrylic standee -->
    <rect x="250" y="70" width="140" height="300" rx="10" fill="url(#panel)" stroke="#A5B4C8" stroke-width="3"/>
  </g>
  <rect x="268" y="90" width="104" height="160" rx="6" fill="#0F172A"/>
  <g fill="#FFFFFF">
    <rect x="280" y="102" width="30" height="30"/>
    <rect x="330" y="102" width="30" height="30"/>
    <rect x="280" y="200" width="30" height="30"/>
    <rect x="288" y="110" width="14" height="14" fill="#0F172A"/>
    <rect x="338" y="110" width="14" height="14" fill="#0F172A"/>
    <rect x="288" y="208" width="14" height="14" fill="#0F172A"/>
    <rect x="312" y="140" width="14" height="14"/>
    <rect x="328" y="158" width="12" height="12"/>
    <rect x="300" y="172" width="10" height="10"/>
  </g>
  <text x="320" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#16A34A">BEAR 360</text>
  <text x="320" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748B">Scan for digital menu</text>
  <rect x="275" y="310" width="90" height="28" rx="14" fill="#16A34A"/>
  <text x="320" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">ORDER NOW</text>
  <text x="320" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#6366F1">Acrylic QR standee</text>
</svg>
